testing:
  start_emulators: true        # set to false if the ammeters are already running (e.g. real devices)
  host: localhost
  timeout_seconds: 2.0         # how long to wait for one ammeter reply
  sampling:
    measurements_count: 10
    total_duration_seconds: null   # null = calculated from count and frequency
    sampling_frequency_hz: 2
  simulation:                  # make the emulators fail on purpose (needs start_emulators: true)
    enabled: false
    failure_rate: 0.2          # probability that one reading fails (0 to 1)
    failure_types: [timeout, garbage, no_reply]
    seed: null                 # a number makes the failure pattern repeatable
    
ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"

analysis:
  statistical_metrics:
  visualization:
    enabled: true
    plot_types:

result_management:
  directory: results/runs      # one JSON file per test run is saved here